<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Pulse911 — Zero-Latency Emergency Dispatch & Clinical Triage (Powered by Moss)</title>
    <meta name="description" content="Next-generation 911 dispatch voice AI and clinical triage copilot powered by Moss sub-10ms semantic retrieval." />
    <style>
      /* First-paint shell: matches the app background so there is never a white
         flash or a blank hang while the JS bundle parses. Removed by React on mount. */
      html, body { margin: 0; background-color: #f8fafc; }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 0%, #eef2ff 0%, #f8fafc 60%);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #64748b;
        z-index: 99999;
      }
      #boot-splash .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-splash .boot-pulse {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(140deg, #f43f5e, #be123c);
        box-shadow: 0 10px 30px -8px rgba(244, 63, 94, 0.55);
        animation: boot-beat 1.1s ease-in-out infinite;
      }
      #boot-splash .boot-label {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }
      #boot-splash .boot-track {
        width: 148px;
        height: 3px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      #boot-splash .boot-track span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f43f5e, #f59e0b);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-beat {
        0%, 100% { transform: scale(1); }
        22% { transform: scale(1.14); }
        44% { transform: scale(1); }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-pulse,
        #boot-splash .boot-track span { animation: none; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-rose-500/20 selection:text-rose-600">
    <div id="root">
      <div id="boot-splash">
        <div class="boot-mark">
          <div class="boot-pulse"></div>
          <div class="boot-label">Pulse911 · Initializing Dispatch Console</div>
          <div class="boot-track"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
